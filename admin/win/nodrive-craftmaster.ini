#
# NoDrive: CraftMaster override for the Windows build (.github/workflows/windows.yml).
# It is read after the upstream craftmaster.ini (CraftMaster --config-override), so
# only the keys below change; everything else (Craft revision, Qt version,
# blueprint branches, binary cache) stays exactly as upstream sets it.
# The workflow hashes this file into the Craft cache key.

[windows-msvc2022_64-cl]
# Upstream builds an NSIS installer whose names come from the Nextcloud blueprint
# ("nextcloud", "Nextcloud GmbH"). NoDrive ships an MSI instead: the portable
# packager only collects the files (and a .7z), and the workflow then runs the
# MSI scripts from admin/win/msi on the collected folder.
Packager/PackageType = PortablePackager
