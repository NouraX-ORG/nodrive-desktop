#
# NoDrive macOS CI: overrides for the upstream craftmaster.ini.
#
# Used as a second config file:
#   CraftMaster.py --config craftmaster.ini --config-override admin/osx/nodrive-craftmaster.ini ...
# CraftMaster reads both files with one ConfigParser (ExtendedInterpolation), so keys here replace
# the same keys of the root file and everything else stays upstream. The root craftmaster.ini is
# not edited (plan section 11.3). [Env] holds the process environment, so ${Env:NAME} works.
#
# Changing this file changes the Craft cache key in .github/workflows/macos.yml.

[GeneralSettings]
# Remove each dependency's build tree once it is installed. Only used when a dependency has to be
# built from source (binary cache miss); keeps the small macOS runner disk and our cache small.
# The client itself is built with --compile --install, which this setting does not touch.
ContinuousIntegration/ClearBuildFolder = True

[macos-clang-arm64]
# Upstream pins /Users/runner/hostedtoolcache/Python/3.12.3/arm64, which does not exist on our
# runner. Use the interpreter installed by actions/setup-python (it exports pythonLocation).
Paths/Python = ${Env:pythonLocation}
