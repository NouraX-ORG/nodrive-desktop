#
# NoDrive for macOS: build, unit tests, .app and .dmg (macOS lane, plans/desktop-plan.md 9.5).
#
# Based on upstream .github/upstream-workflows/macos-craft-ci.yml + macos-build-and-test.yml
# (KDE Craft on GitHub-hosted runners). Differences:
# - Craft blueprints stable-35.0 (upstream file still pointed at stable-34.0).
# - Our own CraftMaster override admin/osx/nodrive-craftmaster.ini; the root craftmaster.ini stays upstream.
# - Resumable Craft cache: the dependency step is time-limited and the cache is saved even when it
#   fails, times out or is cancelled, so the next run continues where this one stopped
#   (GitHub ends any job after 6 hours).
# - Classic sync only (File Provider module off), no Sparkle, no secrets, no Nextcloud team id.
# - Ad-hoc signing only (codesign --sign -). No notarisation, no releases, no tags.
#
# Build-time downloads (not app runtime): CraftMaster (invent.kde.org), Craft and blueprints
# (github.com/nextcloud), Craft's binary package cache (download.nextcloud.com), Homebrew inkscape.

name: macOS

on:
  push:
    branches: [main, platform/macos]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CRAFT_TARGET: macos-clang-arm64
  # Exact version: Craft keeps a virtualenv in its root that points at this interpreter,
  # so the cached root only works with the same Python. Part of the cache key.
  PYTHON_VERSION: "3.12.10"
  BLUEPRINTS_BRANCH: stable-35.0
  KDE_BLUEPRINTS_URL: https://github.com/nextcloud/craft-blueprints-kde.git
  NC_BLUEPRINTS_URL: https://github.com/nextcloud/craft-blueprints-nextcloud.git
  CRAFTMASTER_URL: https://invent.kde.org/packaging/craftmaster.git
  # Same list for every restore and save (the list is part of the cache version).
  # Build and download trees are left out to keep the cache small.
  CRAFT_CACHE_PATHS: |
    CraftMaster
    craft-clone
    macos-clang-arm64/*
    !macos-clang-arm64/build
    !macos-clang-arm64/download

jobs:
  branding:
    name: Branding checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Hooks for the shared branding tools (Linux lane). They switch on by themselves once the
      # files are on this branch.
      - name: Rebrand is applied (tools/rebrand.py --check)
        run: |
          if [ -f tools/rebrand.py ]; then
            python3 tools/rebrand.py --check
          else
            echo "::notice::tools/rebrand.py is not on this branch yet; check skipped"
          fi

      - name: macOS rebrand plugin is applied (tools/rebrand.d/macos.py --check)
        run: |
          if [ -f tools/rebrand.d/macos.py ]; then
            python3 tools/rebrand.d/macos.py --check
          else
            echo "::notice::tools/rebrand.d/macos.py not found; check skipped"
          fi

      - name: Branding sweep (tools/check-branding.py --lane macos)
        run: |
          if [ -f tools/check-branding.py ]; then
            python3 tools/check-branding.py --lane macos --report branding-macos.md
          else
            echo "::notice::tools/check-branding.py is not on this branch yet; sweep skipped"
          fi

      - name: Upload branding report
        if: always() && hashFiles('branding-macos.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: branding-macos
          path: branding-macos.md
          retention-days: 30

  deps:
    name: Craft dependencies (resumable cache)
    runs-on: macos-latest
    # Below GitHub's 6 h job limit, so the cache save at the end always gets to run.
    timeout-minutes: 355
    outputs:
      cache-key: ${{ steps.keys.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Runner
        run: |
          sw_vers
          echo "arch $(uname -m), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB RAM"
          xcode-select -p
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compute Craft cache keys
        id: keys
        env:
          INI_HASH: ${{ hashFiles('craftmaster.ini', 'admin/osx/nodrive-craftmaster.ini') }}
          PY: ${{ steps.python.outputs.python-version }}
        run: |
          kde="$(git ls-remote "$KDE_BLUEPRINTS_URL" "refs/heads/$BLUEPRINTS_BRANCH" | cut -c1-12)"
          nc="$(git ls-remote "$NC_BLUEPRINTS_URL" "refs/heads/$BLUEPRINTS_BRANCH" | cut -c1-12)"
          if [ -z "$kde" ] || [ -z "$nc" ] || [ -z "$INI_HASH" ] || [ -z "$PY" ]; then
            echo "::error::could not resolve the Craft cache key inputs"; exit 1
          fi
          family="macos-craft-v1-py$PY"
          prefix="$family-${INI_HASH:0:16}-kde$kde-nc$nc"
          {
            echo "family=$family"
            echo "prefix=$prefix"
            echo "complete=$prefix-complete"
            echo "partial=$prefix-partial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          echo "complete key: $prefix-complete"

      - name: Look for a complete Craft cache
        id: complete
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.keys.outputs.complete }}
          lookup-only: true

      - name: Restore an earlier Craft cache (resume)
        id: resume
        if: steps.complete.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.keys.outputs.partial }}
          restore-keys: |
            ${{ steps.keys.outputs.prefix }}-partial-
            ${{ steps.keys.outputs.family }}-

      - name: Set up Xcode
        if: steps.complete.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Homebrew dependencies
        if: steps.complete.outputs.cache-hit != 'true'
        run: brew install --cask inkscape

      - name: Set up Craft and blueprints
        id: setup
        if: steps.complete.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          echo "restored from: ${{ steps.resume.outputs.cache-matched-key || 'nothing (fresh start)' }}"
          if [ ! -f CraftMaster/CraftMaster.py ]; then
            git clone -q --depth=1 "$CRAFTMASTER_URL" CraftMaster
          fi
          git -C CraftMaster log -1 --format='CraftMaster %H %cs'
          admin/osx/nodrive-craft.sh --add-blueprint-repository "$KDE_BLUEPRINTS_URL|$BLUEPRINTS_BRANCH|"
          admin/osx/nodrive-craft.sh --add-blueprint-repository "$NC_BLUEPRINTS_URL|$BLUEPRINTS_BRANCH|"
          admin/osx/nodrive-craft.sh craft

      - name: Install the client's Craft dependencies
        id: deps
        if: steps.complete.outputs.cache-hit != 'true'
        # Time limit: leaves room for the cache save below inside the 355 min job.
        timeout-minutes: 290
        run: admin/osx/nodrive-craft.sh --install-deps nextcloud-client

      - name: Disk usage
        if: always() && steps.complete.outputs.cache-hit != 'true'
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh CraftMaster craft-clone "$CRAFT_TARGET"/* 2>/dev/null | sort -h | tail -n 15 || true

      - name: Save complete Craft cache
        if: steps.complete.outputs.cache-hit != 'true' && steps.deps.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.keys.outputs.complete }}

      - name: Save partial Craft cache (resume point for the next run)
        if: always() && (steps.deps.outcome == 'failure' || steps.deps.outcome == 'cancelled')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.keys.outputs.partial }}

  build:
    name: Build, test and package (classic sync, arm64)
    needs: [branding, deps]
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      PKG_BUILD: ${{ github.workspace }}/macos-clang-arm64/build/nextcloud-client
      BUILD_DIR: ${{ github.workspace }}/macos-clang-arm64/build/nextcloud-client/work/build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Runner
        run: |
          sw_vers
          echo "arch $(uname -m), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB RAM"
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift and Xcode versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install Homebrew dependencies
        # CMake needs an SVG converter (cmake/modules/GenerateIconsUtils.cmake).
        run: brew install --cask inkscape

      - name: Restore the Craft cache from the deps job
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build the client with Craft
        id: build
        timeout-minutes: 150
        run: |
          admin/osx/nodrive-craft.sh --compile --install \
            --options "nextcloud-client.srcDir=$GITHUB_WORKSPACE" \
            --options "nextcloud-client.buildFileProviderModule=False" \
            --options "nextcloud-client.buildMacOSBundle=True" \
            --options "nextcloud-client.buildTests=True" \
            --options "nextcloud-client.args=-DMIRALL_VERSION_BUILD=$GITHUB_RUN_NUMBER" \
            nextcloud-client
          df -h "$GITHUB_WORKSPACE"

      - name: Locate the app bundle
        id: locate
        run: |
          app=""
          while IFS= read -r -d '' a; do app="$a"; break; done < <(
            find "$PKG_BUILD" -mindepth 2 -maxdepth 2 -type d -name '*.app' -path '*/image-*' -not -path '*-dbg/*' -print0)
          if [ -z "$app" ] || [ ! -d "$BUILD_DIR" ]; then
            echo "::error::built app bundle or build directory not found under $PKG_BUILD"
            ls -la "$PKG_BUILD" || true
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App bundle: $app"
          ls "$app/Contents/MacOS" "$app/Contents/PlugIns" "$app/Contents/Library/LoginItems" 2>/dev/null || true
          echo "Frameworks: $(ls "$app/Contents/Frameworks" 2>/dev/null | wc -l | tr -d ' ')"
          /usr/libexec/PlistBuddy -c 'Print' "$app/Contents/Info.plist" | grep -E '^\s+(CFBundle(Name|Identifier|ShortVersionString|LongVersionString|Version|Executable)|NSHumanReadableCopyright|NSLocalNetworkUsageDescription|SU[A-Za-z]+) =' || true

      - name: Package (ad-hoc sign, .dmg, .app.zip)
        id: package
        run: |
          admin/osx/nodrive-package.sh \
            --app "${{ steps.locate.outputs.app }}" \
            --build-dir "$BUILD_DIR" \
            --out "$RUNNER_TEMP/dist" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.dmg }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload .app (zip)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      # Hook for the shared sweep tool (Linux lane): runs once check-branding.py supports --artifact.
      - name: Branding sweep of the package (tools/check-branding.py --artifact)
        run: |
          help=""
          if [ -f tools/check-branding.py ]; then help="$(python3 tools/check-branding.py --help 2>&1 || true)"; fi
          case "$help" in
            *--artifact*) python3 tools/check-branding.py --artifact "${{ steps.package.outputs.staged-app }}" --lane macos ;;
            *) echo "::notice::tools/check-branding.py --artifact is not available on this branch yet; sweep skipped" ;;
          esac

      - name: Unit tests (ctest)
        # Also runs when packaging failed, so test results are always reported.
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 60
        run: |
          skip=""
          if [ -f tools/branding/ctest-skip-macos.txt ]; then
            skip="$(grep -v -E '^[[:space:]]*(#|$)' tools/branding/ctest-skip-macos.txt | cut -f1 | paste -s -d '|' - || true)"
          fi
          args=(--output-on-failure --timeout 300 --output-junit "$RUNNER_TEMP/ctest-macos.xml")
          if [ -n "$skip" ]; then
            echo "Skipping: $skip"
            args+=(-E "^($skip)\$")
          fi
          cd "$BUILD_DIR"
          ctest -N | tail -n 1
          ctest "${args[@]}"

      - name: Upload test results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-results
          path: |
            ${{ runner.temp }}/ctest-macos.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/.ninja_log
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
