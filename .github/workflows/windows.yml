#
# NoDrive for Windows: branding gate, KDE Craft build, unit tests, MSI, and an
# install / start / screenshot / uninstall test on a fresh runner (test builds
# only: Actions artifacts, no releases, no signing). Based on upstream's
# .github/upstream-workflows/windows-build-and-test.yml. Needs no secrets.
#
# Jobs
#   branding  ubuntu, ~1 min. tools/rebrand.py --check (shared rebrand and the
#             Windows plugin tools/rebrand.d/windows.py are applied),
#             tools/check-branding.py --lane windows (no unclassified Nextcloud
#             hit), tools/make-icons.py --check.
#   deps      Craft + all client dependencies (Qt, OpenSSL, ...), mostly from the
#             Craft binary cache. The Craft tree is cached with a unique key per
#             run and saved even when the step fails or hits its time limit, so the
#             next run resumes where this one stopped (restore-keys prefix match).
#             A complete tree carries a marker and is not saved again.
#   build     Restores the complete tree from "deps", builds the client from this
#             checkout, makes the MSI (artifact nodrive-windows-msi), sweeps the
#             packaged files (tools/check-branding.py --artifact), then runs the
#             unit tests.
#   install-test  windows-2022, fresh runner: tools/screenshots/windows.ps1 installs
#             the MSI silently, checks names, registry keys, Explorer integration
#             and the config folder, starts the app in English, German, Arabic and
#             dark mode, takes screenshots, records the URL "Log in" hands to the
#             browser, logs DNS (fails on a Nextcloud host), uninstalls silently and
#             checks that it is gone. Artifact nodrive-windows-screenshots.
#
# A test-only run can reuse the MSI of an earlier run:
#   Actions -> Windows -> Run workflow -> reuse_run = <run id>
#
# Runner: windows-2022, as upstream. windows-latest (Windows Server 2025) only has
# Visual Studio 2026, while Craft's windows-msvc2022_64-cl target and the
# prebuilt Craft cache it downloads need Visual Studio 2022 (see docs/build-windows.md).

name: Windows

on:
  push:
    branches: [main, platform/windows]
  workflow_dispatch:
    inputs:
      reuse_run:
        description: "Run id whose nodrive-windows-msi artifact the install test uses (skips deps and build)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download-artifact from an earlier run (reuse_run)

env:
  CRAFT_TARGET: windows-msvc2022_64-cl
  PYTHON_VERSION: '3.12'
  CRAFTMASTER_URL: https://invent.kde.org/packaging/craftmaster.git
  CRAFTMASTER_REVISION: 8a19d8fcab223b8b27126d98a46ed824b5948665
  # Bump to start all Windows Craft caches from scratch.
  CRAFT_CACHE_VERSION: v1
  # Must be identical for restore and save. Build trees, downloads and temp
  # files are left out to keep the cache small (the repo has 10 GB for all caches).
  CRAFT_CACHE_PATHS: |
    CraftMaster
    craft-clone
    windows-msvc2022_64-cl
    !windows-msvc2022_64-cl/build
    !windows-msvc2022_64-cl/download
    !windows-msvc2022_64-cl/tmp
  CRAFT_DEPS_MARKER: windows-msvc2022_64-cl/etc/nodrive-craft-deps.txt

jobs:
  branding:
    name: Branding checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Rebrand is complete (tools/rebrand.py --check, includes rebrand.d/windows.py)
        run: python3 tools/rebrand.py --check

      - name: No unclassified Nextcloud hit (tools/check-branding.py --lane windows)
        run: python3 tools/check-branding.py --lane windows --report branding-windows.md

      - name: Icons are reproducible (tools/make-icons.py --check)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "pillow==12.2.0"
          python3 tools/make-icons.py --check

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branding-windows
          path: branding-windows.md
          if-no-files-found: ignore
          retention-days: 30

  deps:
    name: Craft dependencies
    if: ${{ !inputs.reuse_run }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      cache-key: ${{ steps.result.outputs.cache-key }}
    env:
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      CRAFT_MASTER_OVERRIDE: ${{ github.workspace }}\admin\win\nodrive-craftmaster.ini
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft revisions and the cache key
        id: rev
        shell: python
        run: |
          import configparser, hashlib, os, subprocess
          files = [os.environ["CRAFT_MASTER_CONFIG"], os.environ["CRAFT_MASTER_OVERRIDE"]]
          cfg = configparser.RawConfigParser(allow_no_value=True)
          cfg.optionxform = str
          digest = hashlib.sha256()
          for f in files:
              data = open(f, "rb").read()
              digest.update(data.replace(b"\r\n", b"\n"))
              cfg.read_string(data.decode("utf-8"), source=f)
          craft_rev = cfg.get("General", "CraftRevision")
          kde_ref = cfg.get("BlueprintSettings", "craft/craft-blueprints-kde.revision")
          nc_ref = cfg.get("BlueprintSettings", "craft/craft-blueprints-nextcloud.revision")
          def remote(repo, ref):
              out = subprocess.run(["git", "ls-remote", repo, f"refs/heads/{ref}"], check=True,
                                   capture_output=True, text=True).stdout.split()
              if not out:
                  raise SystemExit(f"Could not resolve {ref} in {repo}")
              return out[0]
          kde_rev = remote("https://github.com/nextcloud/craft-blueprints-kde.git", kde_ref)
          nc_rev = remote("https://github.com/nextcloud/craft-blueprints-nextcloud.git", nc_ref)
          e = os.environ
          base = (f"win-craft-{e['CRAFT_CACHE_VERSION']}-{e['CRAFT_TARGET']}-py{e['PYTHON_VERSION']}"
                  f"-cm{e['CRAFTMASTER_REVISION'][:10]}-ini{digest.hexdigest()[:12]}")
          prefix = f"{base}-{craft_rev[:10]}-{kde_rev[:10]}-{nc_rev[:10]}"
          print(f"craft {craft_rev}\nkde {kde_ref} {kde_rev}\nnextcloud {nc_ref} {nc_rev}\nprefix {prefix}")
          with open(e["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"kde_ref={kde_ref}\nnextcloud_ref={nc_ref}\nbase={base}\nprefix={prefix}\n")

      - name: Restore Craft tree
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.rev.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.rev.outputs.prefix }}-
            ${{ steps.rev.outputs.base }}-

      - name: Check the restored tree
        id: state
        shell: pwsh
        env:
          PREFIX: ${{ steps.rev.outputs.prefix }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          $complete = $false
          if (Test-Path -LiteralPath $env:CRAFT_DEPS_MARKER) {
            $complete = ((Get-Content -LiteralPath $env:CRAFT_DEPS_MARKER -Raw).Trim() -eq $env:PREFIX)
          }
          "Restored: '$env:MATCHED'; complete for this key: $complete"
          Get-PSDrive -PSProvider FileSystem | Where-Object Used | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          "complete=$($complete.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Craft and the client dependencies
        id: install
        if: steps.state.outputs.complete != 'true'
        # Leaves time inside the job limit to save the cache; the next run resumes.
        timeout-minutes: 290
        shell: pwsh
        env:
          KDE_REF: ${{ steps.rev.outputs.kde_ref }}
          NEXTCLOUD_REF: ${{ steps.rev.outputs.nextcloud_ref }}
          PREFIX: ${{ steps.rev.outputs.prefix }}
        run: |
          if (-not (Test-Path -LiteralPath "$env:CRAFT_MASTER_LOCATION\.git")) {
            & cmd /C "git clone -q $env:CRAFTMASTER_URL `"$env:CRAFT_MASTER_LOCATION`" 2>&1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $have = git -C "$env:CRAFT_MASTER_LOCATION" rev-list --all | Select-String -SimpleMatch $env:CRAFTMASTER_REVISION -Quiet
          if (-not $have) { git -C "$env:CRAFT_MASTER_LOCATION" fetch -q origin }
          git -C "$env:CRAFT_MASTER_LOCATION" checkout -q -f $env:CRAFTMASTER_REVISION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function craft() {
            python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --config-override "$env:CRAFT_MASTER_OVERRIDE" --target $env:CRAFT_TARGET -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|$env:KDE_REF|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|$env:NEXTCLOUD_REF|"
          craft craft
          craft --install-deps nextcloud-client
          Set-Content -LiteralPath $env:CRAFT_DEPS_MARKER -Value $env:PREFIX -Encoding utf8
          Get-PSDrive -PSProvider FileSystem | Where-Object Used | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Save Craft tree (also after a failure or time-out)
        if: always() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure' || steps.install.outcome == 'cancelled')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: Result
        id: result
        shell: pwsh
        env:
          COMPLETE: ${{ steps.state.outputs.complete }}
          INSTALL: ${{ steps.install.outcome }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          PRIMARY: ${{ steps.restore.outputs.cache-primary-key }}
        run: |
          if ($env:COMPLETE -eq 'true') { $key = $env:MATCHED }
          elseif ($env:INSTALL -eq 'success') { $key = $env:PRIMARY }
          else { "Dependencies are not complete yet (install: $env:INSTALL)"; exit 1 }
          "Complete Craft tree: $key"
          "cache-key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    name: Build, MSI and unit tests
    needs: [branding, deps]
    if: ${{ !inputs.reuse_run }}
    runs-on: windows-2022
    timeout-minutes: 300
    outputs:
      msi-name: ${{ steps.msi.outputs.msi-name }}
    env:
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      CRAFT_MASTER_OVERRIDE: ${{ github.workspace }}\admin\win\nodrive-craftmaster.ini
      CRAFT_ROOT: ${{ github.workspace }}\windows-msvc2022_64-cl
      BUILD_DIR: ${{ github.workspace }}\windows-msvc2022_64-cl\build\nextcloud-client\work\build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore Craft tree
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CRAFT_CACHE_PATHS }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install Inkscape (SVG converter required by CMake)
        shell: pwsh
        run: choco install inkscape -y --no-progress

      - name: Prepare
        shell: pwsh
        run: |
          "$env:CRAFT_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Two fixes to this job's copy of the Nextcloud client blueprint (the
          # restored cache is not saved again, nothing upstream changes):
          $bpDir = Get-ChildItem -LiteralPath "$env:CRAFT_ROOT\etc\blueprints\locations" -Recurse -Directory -Filter nextcloud-client |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'nextcloud-client.py') } | Select-Object -First 1
          if (-not $bpDir) { throw 'nextcloud-client blueprint not found in the Craft root' }
          # 1. createPackage() calls os.path.join without "import os" (NameError in
          #    "craft --package"; upstream's CI never packages on Windows).
          $py = Join-Path $bpDir.FullName 'nextcloud-client.py'
          $src = Get-Content -LiteralPath $py -Raw
          if ($src -notmatch '(?m)^import os\r?$') {
            $src = [regex]::Replace($src, '(?m)^(import info)(\r?\n)', '$1$2import os$2', 1)
            if ($src -notmatch '(?m)^import os\r?$') { throw "could not add 'import os' to $py" }
            Set-Content -LiteralPath $py -Value $src -NoNewline -Encoding utf8
          }
          # 2. The package blacklist drops every bin\*.exe except nextcloud(cmd).exe;
          #    keep NoDrive's executables too.
          $bl = Join-Path $bpDir.FullName 'blacklist.txt'
          $text = Get-Content -LiteralPath $bl -Raw
          if ($text -notmatch 'nodrive\|nodrivecmd\|') {
            $text = $text.Replace('(?!(nextcloud|nextcloudcmd|', '(?!(nodrive|nodrivecmd|nextcloud|nextcloudcmd|')
            if ($text -notmatch 'nodrive\|nodrivecmd\|') { throw "unexpected executable rule in $bl" }
            Set-Content -LiteralPath $bl -Value $text -NoNewline -Encoding utf8
          }
          Select-String -LiteralPath $py -Pattern '^import'
          Select-String -LiteralPath $bl -Pattern '\.exe'

      - name: Compile
        id: compile
        timeout-minutes: 150
        shell: pwsh
        run: |
          function craft() {
            python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --config-override "$env:CRAFT_MASTER_OVERRIDE" --target $env:CRAFT_TARGET -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --options "nextcloud-client.srcDir=$env:GITHUB_WORKSPACE" --options "nextcloud-client.args=-DBUILD_WIN_MSI=ON -DMIRALL_VERSION_BUILD=$env:GITHUB_RUN_NUMBER" nextcloud-client

      - name: Collect files (Craft portable package)
        timeout-minutes: 30
        shell: pwsh
        run: |
          function craft() {
            python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --config-override "$env:CRAFT_MASTER_OVERRIDE" --target $env:CRAFT_TARGET -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --options "nextcloud-client.srcDir=$env:GITHUB_WORKSPACE" --options "nextcloud-client.args=-DBUILD_WIN_MSI=ON -DMIRALL_VERSION_BUILD=$env:GITHUB_RUN_NUMBER" --package nextcloud-client

      - name: Build the MSI
        id: msi
        timeout-minutes: 30
        shell: pwsh
        run: ./admin/win/ci/make-msi-ci.ps1 -CraftRoot "$env:CRAFT_ROOT" -SourceDir "$env:GITHUB_WORKSPACE" -OutDir "$env:RUNNER_TEMP\out"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-windows-msi
          path: ${{ runner.temp }}\out\*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Packaged-files sweep (tools/check-branding.py --artifact)
        # Text files, compiled translations (.qm) and the URLs inside every
        # binary of the collected app folder; an unclassified hit fails the job.
        shell: pwsh
        env:
          COLLECT_DIR: ${{ steps.msi.outputs.collect-dir }}
        run: |
          python tools/check-branding.py --artifact "$env:COLLECT_DIR" --lane windows --report "$env:RUNNER_TEMP\logs\artifact-sweep-collect.md"
          exit $LASTEXITCODE

      - name: Unit tests
        # Also when packaging failed, so every run reports the test results.
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        timeout-minutes: 75
        shell: pwsh
        run: |
          $skip = 'tools/branding/ctest-skip-windows.txt'
          $ctestArgs = @('--output-on-failure', '--timeout', '300')
          if (Test-Path $skip) {
            $names = Get-Content $skip | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object { ($_ -split "`t")[0].Trim() } | Where-Object { $_ }
            if ($names) { $ctestArgs += @('-E', ('^(' + (($names | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$')); "Skipping: $($names -join ', ')" }
          }
          Set-Location $env:BUILD_DIR
          & ctest @ctestArgs
          exit $LASTEXITCODE

      - name: Upload test log and sweep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-windows-build-logs
          path: |
            ${{ env.BUILD_DIR }}\Testing\Temporary\LastTest*.log
            ${{ runner.temp }}\logs\
          if-no-files-found: ignore
          retention-days: 30

  install-test:
    name: Install, start, screenshots, uninstall
    needs: [branding, build]
    # Also after failed unit tests, as long as the MSI was built (or reused).
    if: ${{ !cancelled() && needs.branding.result == 'success' && (needs.build.outputs.msi-name != '' || inputs.reuse_run) }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the MSI (this run)
        if: ${{ !inputs.reuse_run }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-windows-msi
          path: msi

      - name: Download the MSI (run ${{ inputs.reuse_run }})
        if: ${{ inputs.reuse_run }}
        uses: actions/download-artifact@v8
        with:
          name: nodrive-windows-msi
          path: msi
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - name: Install, start, screenshots, network check, uninstall (tools/screenshots/windows.ps1)
        shell: powershell
        run: |
          $msi = Get-ChildItem -Path msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI in the artifact' }
          "MSI: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
          & ./tools/screenshots/windows.ps1 -Msi $msi.FullName -Out smoke -Root $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      - name: Sweep of the files inside the MSI (tools/check-branding.py --artifact)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $dirFile = 'smoke/admin-image-app-dir.txt'
          if (-not (Test-Path $dirFile)) { "artifact-sweep`tFAIL`tno administrative image" | Add-Content smoke/results.tsv; exit 1 }
          $dir = (Get-Content $dirFile -Raw).Trim()
          python tools/check-branding.py --artifact "$dir" --lane windows --report smoke/artifact-sweep.md --list > smoke/logs/artifact-sweep.txt
          $code = $LASTEXITCODE
          $sum = (Select-String -Path smoke/logs/artifact-sweep.txt -Pattern 'hits \(' | Select-Object -First 1).Line
          $last = Get-Content smoke/logs/artifact-sweep.txt -Tail 1
          "artifact-sweep`t$(if ($code -eq 0) { 'PASS' } else { 'FAIL' })`t$sum; $last" | Add-Content smoke/results.tsv -Encoding utf8
          Get-Content smoke/logs/artifact-sweep.txt -Tail 30
          exit $code

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path smoke/results.tsv) {
            $lines = @('## NoDrive Windows install and smoke test', '', '| Check | Result | Evidence |', '|---|---|---|')
            $lines += Get-Content smoke/results.tsv | Where-Object { $_ } | ForEach-Object { $c = $_ -split "`t", 3; "| $($c[0]) | $($c[1]) | $($c[2] -replace '\|', '\|') |" }
            $lines | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Get-Content smoke/results.tsv
          }
          if (Test-Path smoke/net/network-report.md) { Get-Content smoke/net/network-report.md | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8 }

      - name: Upload screenshots, logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodrive-windows-screenshots
          path: |
            smoke/
            !smoke/admin-image/
          if-no-files-found: warn
          retention-days: 30
